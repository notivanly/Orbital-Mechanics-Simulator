<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OrbitLab · Orbital Mechanics</title><style>*{box-sizing:border-box}body{margin:0;background:#0b1220;color:#e6edf7;font:15px system-ui,Arial}header{padding:23px 5vw;border-bottom:1px solid #263348;background:#101b30}h1{margin:0;font-size:27px}header p{color:#9bb0ce;margin:7px 0 0}.wrap{max-width:1150px;margin:25px auto;padding:0 20px;display:grid;grid-template-columns:320px 1fr;gap:20px}.panel{background:#121f34;border:1px solid #293b56;border-radius:14px;padding:20px}.controls label{display:block;margin:15px 0 5px;color:#b9cbea}input,select,button{font:inherit}input:not([type=range]),select{width:100%;padding:10px;background:#091525;color:white;border:1px solid #435677;border-radius:8px}input[type=range]{width:100%;accent-color:#65d7d0}button{cursor:pointer;border:0;border-radius:8px;padding:10px 14px;background:#40c4b7;color:#072526;font-weight:700;margin:4px 3px 4px 0}button.secondary{background:#273c57;color:#e8f2ff}.stats{display:flex;flex-wrap:wrap;gap:9px;margin:14px 0}.stat{background:#1b2c45;border-radius:9px;padding:11px 14px;min-width:130px}.stat b{display:block;color:#66e4d5;font-size:19px}canvas{display:block;width:100%;height:auto;background:#081323;border-radius:10px;border:1px solid #30405b}small,.hint{color:#a7bad2}table{width:100%;border-collapse:collapse}td,th{padding:9px;text-align:left;border-bottom:1px solid #34445d} .controls p{line-height:1.5} @media(max-width:760px){.wrap{grid-template-columns:1fr}} </style></head><body><header><h1>OrbitLab · Orbital Mechanics</h1><p>Explore two-body gravity with a simple spacecraft simulator.</p></header><main class="wrap"><section class="panel controls"><h2>Launch settings</h2><label>Central body</label><select id="planet"><option value="earth">Earth</option><option value="mars">Mars</option><option value="moon">Moon</option></select><label>Altitude above surface (km): <span id="aV"></span></label><input type="range" id="alt" min="100" max="15000" step="100" value="400"><label>Starting tangential speed (km/s): <span id="vV"></span></label><input type="range" id="speed" min="0" max="12" step="0.1" value="7.7"><p><button id="reset">Launch / Reset</button><button class="secondary" id="pause">Pause</button></p><p class="hint">Uses an ideal two-body gravitational model, excluding atmosphere and other bodies.</p></section><section class="panel"><div class="stats"><div class="stat">Circular speed<b id="circ">–</b></div><div class="stat">Escape speed<b id="esc">–</b></div><div class="stat">Distance<b id="dist">–</b></div></div><canvas id="c" width="760" height="540"></canvas><p id="state" class="hint">Click Launch to simulate.</p></section></main><script>const bodies={earth:{mu:398600,r:6371,color:'#53a8ff'},mars:{mu:42828,r:3389.5,color:'#df8355'},moon:{mu:4902.8,r:1737.4,color:'#bbb'}},$=id=>document.getElementById(id),c=$('c'),ctx=c.getContext('2d');let x,y,vx,vy,timer,paused=false,trail=[],scale=1,b;function init(){b=bodies[$('planet').value];let r=b.r+ +$('alt').value;x=r;y=0;vx=0;vy=+$('speed').value;trail=[];scale=Math.max(r*2.6,b.r*3);paused=false;$('pause').textContent='Pause';$('aV').textContent=$('alt').value;$('vV').textContent=(+vy).toFixed(1);$('circ').textContent=Math.sqrt(b.mu/r).toFixed(2)+' km/s';$('esc').textContent=Math.sqrt(2*b.mu/r).toFixed(2)+' km/s'}function draw(){ctx.clearRect(0,0,760,540);ctx.save();ctx.translate(380,270);const S=240/scale;ctx.fillStyle=b.color;ctx.beginPath();ctx.arc(0,0,b.r*S,0,7);ctx.fill();ctx.strokeStyle='#e5d5a8';ctx.lineWidth=1.5;ctx.beginPath();for(let i=0;i<trail.length;i++){let p=trail[i];i?ctx.lineTo(p[0]*S,p[1]*S):ctx.moveTo(p[0]*S,p[1]*S)}ctx.stroke();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x*S,y*S,5,0,7);ctx.fill();ctx.restore();$('dist').textContent=(Math.hypot(x,y)-b.r).toFixed(0)+' km';}function step(){if(!paused){for(let i=0;i<18;i++){let dt=8,r=Math.hypot(x,y),a=-b.mu/(r*r*r);vx+=a*x*dt;vy+=a*y*dt;x+=vx*dt;y+=vy*dt;if(r<b.r){paused=true;$('state').textContent='Surface collision. Adjust launch speed.';break}}trail.push([x,y]);if(trail.length>450)trail.shift();}draw()}$('reset').onclick=()=>{init();$('state').textContent='Simulation running'};$('pause').onclick=()=>{paused=!paused;$('pause').textContent=paused?'Resume':'Pause'};['planet','alt','speed'].forEach(id=>$(id).oninput=init);init();setInterval(step,30);</script></body></html>
